name: pages

# Publishes the two editions to https://nimony.qouver.com. The domain's DNS record
# points at GitHub Pages through Cloudflare; nothing here writes to the repository,
# and a pull request never reaches this workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time. A queued deploy must not cancel the one already publishing,
# or the site is left half-written.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: "Pages: render both editions and publish"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: "Check out"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: "Cache Quarto runtime"
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/quarto
            ~/.quarto
          key: quarto-1.10.19-${{ runner.os }}-${{ runner.arch }}

      - name: "Install Quarto 1.10.19"
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2
        with:
          version: '1.10.19'

      # ./task build needs Quarto only: it stages both editions and fails closed on
      # an unpaired chapter. Sample compilation is CI's job, not the deploy's.
      - name: "Render both editions"
        run: ./task build

      - name: "Custom domain and root page"
        run: |
          printf 'nimony.qouver.com\n' > _book/CNAME
          cp site/index.html _book/index.html

      - name: "Upload the site"
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v3
        with:
          path: _book

      - name: "Deploy to GitHub Pages"
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
