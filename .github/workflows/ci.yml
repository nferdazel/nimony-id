name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  book:
    name: "Book: verify samples and render"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Branch and pull request runs of this job carry the write token too; only
    # publishing is gated behind a v* tag.
    permissions:
      contents: write
    steps:
      # Actions are pinned by commit SHA; Dependabot opens the bump. A tag such as
      # @v4 can be moved by its owner, a SHA cannot.
      - name: "Check out"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Install Nim 2.4.0 for the toolchain build"
        uses: jiro4989/setup-nim-action@efd7b4f2cab6441597916438c4f03425167d453b # v2
        with:
          nim-version: '2.4.0'

      - name: "Cache Nimony 4ba90a7"
        id: nimony
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/opt/nimony/4ba90a7
          key: nimony-${{ runner.os }}-${{ runner.arch }}-4ba90a7-nim-2.4.0

      - name: "Build Nimony 4ba90a7 on a cache miss"
        if: steps.nimony.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.local/opt/nimony"
          git clone https://github.com/nim-lang/nimony.git "$HOME/.local/opt/nimony/4ba90a7"
          cd "$HOME/.local/opt/nimony/4ba90a7"
          git checkout 4ba90a781b0b22d0821efaa153c129c37cef6143
          nim c -r src/hastur/hastur build all

      - name: "Cache Quarto runtime"
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/quarto
            ~/.quarto
          key: quarto-1.10.19-${{ runner.os }}-${{ runner.arch }}

      - name: "Install Quarto 1.10.19"
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2
        with:
          version: '1.10.19'

      - name: "Fail closed when no sample exists"
        run: |
          found=$(find samples -mindepth 2 -maxdepth 2 -name '*.nim' -print -quit)
          if [ -z "$found" ]; then
            echo "no sample files under samples/*/*.nim" >&2
            exit 1
          fi

      - name: "Verify samples and render the book"
        run: ./task check

      # A tag names one snapshot of the book. If it does not match VERSION, the
      # artefact would be labelled with a number no chapter carries.
      - name: "Tag matches VERSION"
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "v$version" != "$TAG" ]; then
            echo "tag '$TAG' does not match VERSION '$version'" >&2
            exit 1
          fi

      - name: "Upload site (both languages)"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: situs
          path: public
          retention-days: 7

      - name: "Upload PDFs"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pdf
          path: public/**/*.pdf
          retention-days: 30

      # Same commit and the same Quarto version the VPS uses, so these attach
      # the same PDFs the site serves. Both renders share one file name, and a
      # release cannot hold two assets with the same name, so each copy gets a
      # unique file name and the label the release lists. Re-running a failed
      # tag build uploads the assets again instead of failing on an existing
      # release.
      - name: "Publish GitHub release"
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cp public/Nimony-A-Pinned-Guide.pdf public/Nimony-A-Pinned-Guide-ID.pdf
          cp public/en/Nimony-A-Pinned-Guide.pdf public/Nimony-A-Pinned-Guide-EN.pdf
          set -- \
            "public/Nimony-A-Pinned-Guide-ID.pdf#Nimony - A Pinned Guide (ID).pdf" \
            "public/Nimony-A-Pinned-Guide-EN.pdf#Nimony - A Pinned Guide (EN).pdf"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$@" --clobber
          else
            gh release create "$TAG" "$@" --title "$TAG" --generate-notes
          fi
