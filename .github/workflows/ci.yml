name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  book:
    name: "Book: verify samples and render"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Branch and pull request runs of this job carry the write token too; only
    # publishing is gated behind a v* tag.
    permissions:
      contents: write
    steps:
      # Actions are pinned by commit SHA; Dependabot opens the bump. A tag such as
      # @v4 can be moved by its owner, a SHA cannot.
      - name: "Check out"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Install Nim 2.4.0 for the toolchain build"
        uses: jiro4989/setup-nim-action@efd7b4f2cab6441597916438c4f03425167d453b # v2
        with:
          nim-version: '2.4.0'

      - name: "Cache Nimony 4ba90a7"
        id: nimony
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/opt/nimony/4ba90a7
          key: nimony-${{ runner.os }}-${{ runner.arch }}-4ba90a7-nim-2.4.0

      - name: "Build Nimony 4ba90a7 on a cache miss"
        if: steps.nimony.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.local/opt/nimony"
          git clone https://github.com/nim-lang/nimony.git "$HOME/.local/opt/nimony/4ba90a7"
          cd "$HOME/.local/opt/nimony/4ba90a7"
          git checkout 4ba90a781b0b22d0821efaa153c129c37cef6143
          nim c -r src/hastur/hastur build all

      - name: "Cache Quarto runtime"
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/quarto
            ~/.quarto
          key: quarto-1.10.19-${{ runner.os }}-${{ runner.arch }}

      - name: "Install Quarto 1.10.19"
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2
        with:
          version: '1.10.19'

      - name: "Fail closed when no sample exists"
        run: |
          found=$(find samples -mindepth 2 -maxdepth 2 -name '*.nim' -print -quit)
          if [ -z "$found" ]; then
            echo "no sample files under samples/*/*.nim" >&2
            exit 1
          fi

      - name: "Verify samples and render the book"
        run: ./task check

      # A tag names one snapshot of the book. If it does not match VERSION, the
      # artefact would be labelled with a number no chapter carries.
      - name: "Tag matches VERSION"
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "v$version" != "$TAG" ]; then
            echo "tag '$TAG' does not match VERSION '$version'" >&2
            exit 1
          fi

      - name: "Upload site (both languages)"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: situs
          path: public
          retention-days: 7

      - name: "Upload PDFs"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pdf
          path: public/**/*.pdf
          retention-days: 30

      # The parity check reads the chapter list out of the PDFs, so the runner
      # needs poppler; the ubuntu image does not ship pdftotext.
      - name: "Install poppler-utils for the parity check"
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      # One book, two doors: the site and the latest release must list the same
      # chapters. This runs on every push to main and reads both sides out of
      # the PDFs, not the sources. When they differ the push is a content
      # change, so it cuts the release from this very commit — the tag, the
      # assets and the site are then one build. A content merge that forgot to
      # bump VERSION has no free tag to publish under and fails here instead of
      # leaving the release one chapter behind again.
      - name: "Parity: site and latest release are one book"
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          download() {
            rm -rf .release
            mkdir -p .release
            gh release download "$1" --dir .release --pattern '*.pdf'
          }
          compare() {
            python3 tools/check-parity.py \
              --built-id public/Nimony-A-Pinned-Guide.pdf \
              --built-en public/en/Nimony-A-Pinned-Guide.pdf \
              --release-id .release/Nimony-A-Pinned-Guide-ID.pdf \
              --release-en .release/Nimony-A-Pinned-Guide-EN.pdf
          }
          # Exit 2 means the check could not read a PDF: that is a broken tool
          # or a bad download, never evidence that the book changed, so it must
          # not fall through to cutting a release.
          run_compare() {
            status=0
            compare || status=$?
            if [ "$status" -eq 2 ]; then
              echo "parity check could not read a PDF; fix the check before releasing" >&2
              exit 2
            fi
            return "$status"
          }
          latest="$(gh release view --json tagName --jq .tagName)"
          download "$latest"
          if run_compare; then
            echo "ok: $latest already lists the chapters this commit builds"
            exit 0
          fi
          tag="v$(tr -d '[:space:]' < VERSION)"
          if [ "$tag" = "$latest" ]; then
            echo "chapters changed since $latest, but VERSION is still ${tag#v}" >&2
            echo "bump VERSION in this merge (./task release) so the push can carry a release" >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            download "$tag"
            if run_compare; then
              echo "ok: $tag already lists the chapters this commit builds"
              exit 0
            fi
            echo "release $tag exists but lists a different chapter set; VERSION must move" >&2
            exit 1
          fi
          echo "chapters changed since $latest: cutting $tag at $GITHUB_SHA"
          bash tools/publish-release.sh "$tag" "$GITHUB_SHA"
          download "$tag"
          run_compare

      # Same commit and the same Quarto version the VPS uses, so these attach
      # the same PDFs the site serves. A tag pushed by hand still publishes
      # through this path; a tag created by the parity step above does not
      # retrigger the workflow, which is why that step publishes directly.
      - name: "Publish GitHub release"
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: bash tools/publish-release.sh "$TAG" "$GITHUB_SHA"
