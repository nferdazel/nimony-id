name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  book:
    name: "Book: verify samples and render"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Actions are pinned by commit SHA; Dependabot opens the bump. A tag such as
      # @v4 can be moved by its owner, a SHA cannot.
      - name: "Check out"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: "Install Nim 2.4.0 for the toolchain build"
        uses: jiro4989/setup-nim-action@efd7b4f2cab6441597916438c4f03425167d453b # v2
        with:
          nim-version: '2.4.0'

      - name: "Cache Nimony 4ba90a7"
        id: nimony
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.local/opt/nimony/4ba90a7
          key: nimony-${{ runner.os }}-${{ runner.arch }}-4ba90a7-nim-2.4.0

      - name: "Build Nimony 4ba90a7 on a cache miss"
        if: steps.nimony.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.local/opt/nimony"
          git clone https://github.com/nim-lang/nimony.git "$HOME/.local/opt/nimony/4ba90a7"
          cd "$HOME/.local/opt/nimony/4ba90a7"
          git checkout 4ba90a781b0b22d0821efaa153c129c37cef6143
          nim c -r src/hastur/hastur build all

      - name: "Cache Quarto runtime"
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/quarto
            ~/.quarto
          key: quarto-1.10.19-${{ runner.os }}-${{ runner.arch }}

      - name: "Install Quarto 1.10.19"
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2
        with:
          version: '1.10.19'

      - name: "Fail closed when no sample exists"
        run: |
          found=$(find samples -mindepth 2 -maxdepth 2 -name '*.nim' -print -quit)
          if [ -z "$found" ]; then
            echo "no sample files under samples/*/*.nim" >&2
            exit 1
          fi

      - name: "Verify samples and render the book"
        run: ./task check

      # A tag names one snapshot of the book. If it does not match VERSION, the
      # artefact would be labelled with a number no chapter carries.
      - name: "Tag matches VERSION"
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "v$version" != "$TAG" ]; then
            echo "tag '$TAG' does not match VERSION '$version'" >&2
            exit 1
          fi

      - name: "Upload the rendered book"
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nimony-id-${{ github.ref_name }}
          path: _book
          retention-days: 30
