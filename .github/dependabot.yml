version: 2
updates:
  # Workflows pin actions by commit SHA; this is what moves the pins.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # One PR for every action instead of one PR per action.
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore"
    labels:
      - dependencies
