lang: en

project:
  type: book
  output-dir: _book
  resources:
    - assets/ku.css

book:
  title: "Nimony: A Pinned Guide"
  subtitle: "Learning the language against one fixed commit"
  author: "Fredianto"
  date: "2026-11-12"
  language: en
  chapters:
    - index.qmd
    - chapters/01-what-nimony-is/en.md
    - chapters/02-the-pinned-toolchain/en.md
    - chapters/03-values-names-mutability/en.md
    - chapters/04-numbers-types-conversion/en.md
    - chapters/05-strings/en.md
    - chapters/06-branching/en.md
    - chapters/07-loops-ranges/en.md
    - chapters/08-procedures/en.md
    - chapters/09-overloading-and-ufcs/en.md
    - chapters/10-arrays-sequences-tuples/en.md
    - chapters/11-objects-enums-distinct/en.md
    - chapters/12-sum-types-case/en.md
  search: true
  sidebar:
    style: docked
    collapse-level: 1
    tools:
      - text: "Bahasa Indonesia"
        href: "https://nimony.qouver.com/"
  page-footer:
    left: "CC BY-SA 4.0 · code samples MIT"
    right: "[PDF](https://nimony.qouver.com/en/Nimony-A-Pinned-Guide.pdf) · [Bahasa Indonesia](https://nimony.qouver.com/)"

format:
  html:
    lang: en
    css: assets/ku.css
    toc: true
    toc-depth: 2
    toc-title: "On this page"
    code-copy: true
    code-overflow: wrap
    include-before-body: assets/skip-link.html
    fig-cap-location: bottom
  typst:
    filters:
      - ../../tools/typst-links.lua
    toc-depth: 1
    lang: en
    template-partials:
      - assets/typst/typst-show.typ
    number-sections: true
